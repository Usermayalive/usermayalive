<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img">
  <defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#dfe4ee" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" fill="#f4f6fb"/>
    <circle cx="1.5" cy="1.5" r="1.1" fill="#7d86a8"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="45%" r="55%">
    <stop offset="0" stop-color="#fbf8d9" stop-opacity=".9"/>
    <stop offset="1" stop-color="#eef1f7" stop-opacity="0"/>
  </radialGradient></defs>
  <style>
    text { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; fill: #1f2430 }
    .label { font-family: 'Courier Prime','Courier New',Courier,monospace; font-size: 11px; letter-spacing: 4px; fill: #5b6475 }
    .small { font-size: 11px; fill: #5b6475 }
    .foot { font-family: 'Courier Prime','Courier New',Courier,monospace; font-size: 10px; fill: #5b6475 }
    .in { opacity: 0; animation: in .8s ease-out forwards }
    @keyframes in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important } }
    
    .spin { animation: spin 40s linear infinite } .rev { animation-duration: 70s; animation-direction: reverse }
    @keyframes spin { to { transform: rotate(360deg) } }
    .float { animation: float 6s ease-in-out infinite }
    @keyframes float { 50% { transform: translateY(-8px) } }
    .pulse { animation: pulse 2.4s ease-in-out infinite }
    @keyframes pulse { 50% { opacity: .25 } }
  </style>
  <rect width="1080" height="620" rx="26" fill="#eef1f7"/>
